name: Build OFX bundle (macOS)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier une Release sur un tag vX.Y

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de non-régression du moteur
        run: |
          g++ -O3 -std=c++17 -pthread tests/regression_test.cpp src/Engine.cpp -o regtest
          ./regtest

  build-macos:
    needs: engine-tests
    runs-on: macos-14          # Apple Silicon ; produit un binaire universel arm64 + x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le SDK OpenFX
        run: git clone --recursive --depth 1 https://github.com/AcademySoftwareFoundation/openfx "$RUNNER_TEMP/openfx"

      - name: Compiler
        run: |
          cmake -S . -B build -DOFX_SDK_DIR="$RUNNER_TEMP/openfx" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Vérifier le bundle
        run: |
          B=build/RetroSignalChain.ofx.bundle
          find "$B" -type f
          lipo -info "$B/Contents/MacOS/RetroSignalChain.ofx"
          codesign -dv "$B" 2>&1 | head -5
          nm -gU "$B/Contents/MacOS/RetroSignalChain.ofx" | grep -E "OfxGetNumberOfPlugins|OfxGetPlugin"

      - name: Archiver (ditto conserve la structure du bundle)
        run: ditto -c -k --keepParent build/RetroSignalChain.ofx.bundle RetroSignalChain.ofx.bundle.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RetroSignalChain.ofx.bundle
          path: RetroSignalChain.ofx.bundle.zip

      - name: Publier une Release (tags vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroSignalChain.ofx.bundle.zip
